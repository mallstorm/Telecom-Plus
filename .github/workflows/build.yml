name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: telecom-plus-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to release
        if: github.event_name == 'push' && github.ref_name == 'claude/restore-telecom-plus'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk Telecom-Plus.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk Telecom-Plus.apk --title "Telecom+ (последняя сборка)" --notes "Debug APK, коммит ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --prerelease
