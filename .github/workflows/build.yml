name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build release APKs (fixed signing key)
        run: gradle --no-daemon :app:assembleFullRelease :app:assembleSafeRelease
      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/full/release/*.apk out/Telecom-Plus.apk
          cp app/build/outputs/apk/safe/release/*.apk out/Telecom-Plus-safe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: telecom-plus
          path: out/*.apk
      - name: Publish APK to release
        if: github.event_name == 'push' && github.ref_name == 'claude/restore-telecom-plus'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk out/Telecom-Plus.apk out/Telecom-Plus-safe.apk --title "Telecom+ (последняя сборка)" --notes "Release APK (постоянная подпись), коммит ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --prerelease
